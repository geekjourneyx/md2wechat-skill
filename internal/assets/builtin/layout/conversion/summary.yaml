schema_version: "1"
name: summary
lifecycle: recommended
body_format: fields
version: "1.0.0"
since: "1.5.0"
category: conversion
input_positions: [body-kv]
serves: [memorability, readability]
content_types: [opinion, tutorial, report]
industry: [general]
tags: [conversion, summary, conclusion, highlight, closing]
position: closing
when_to_use: |
  一句话总结，适合章节末尾或文章结尾。
  帮助读者带走最重要的一个判断。
when_not_to_use: |
  需要多点总结时用 checklist；
  需要展开说明时写正文段落。
pairs_well_with: [verdict, cta, subscribe]
avoid_combining_with: []
anti_pattern: |
  默认缺少 highlight 导致渲染失败；
  highlight 写成描述性语句而非判断；
  body 写太长变成第二个正文段落。
fields:
  required: []
  required_when_no_variant: [highlight]
  optional:
    - name: variant
      description: 总结结构变体
      enum: [three, decision, save]
      example: three
    - name: eyebrow
      description: 标签词
      example: "一句话总结"
    - name: highlight
      description: 一句话总结
      example: "先把结构搭稳，再让主题接管气质"
    - name: title
      description: 摘要标题
      example: "发布前带走三点"
    - name: body
      description: 展开说明
      example: "同一篇内容切换主题时，重点仍然清楚。"
    - name: items
      description: 总结项，用 | 分隔
      example: "结构先于风格 | 模块服务阅读 | 主题定义气质"
    - name: fit
      description: 适合项，用 | 分隔
      example: "需要稳定发布的人 | 需要复用结构的人"
    - name: not_fit
      description: 不适合项，用 | 分隔
      example: "只写短讯的人"
    - name: recommendation
      description: 决策建议
      example: "先校准契约，再扩展模块。"
    - name: note
      description: 补充说明
      example: "收藏后按清单执行"
variants:
  - name: three
    aliases: [points]
    use_when: 需要列出三点总结
    required: [items]
    example: |
      :::summary
      variant: three
      title: 发布前带走三点
      items: 结构先于风格 | 模块服务阅读 | 主题定义气质
      :::
  - name: decision
    aliases: [recommend]
    use_when: 需要给出适用判断或建议
    required_any:
      - [fit, recommendation]
    example: |
      :::summary
      variant: decision
      title: 是否适合现在采用
      fit: 需要稳定发布的人 | 需要复用结构的人
      recommendation: 先校准契约，再扩展模块。
      :::
  - name: save
    aliases: [checklist, action]
    use_when: 需要生成收藏清单
    required: [items]
    example: |
      :::summary
      variant: save
      title: 收藏后按这三步执行
      items: 校验输入 | 预览输出 | 发布检查
      :::
example: |
  :::summary
  eyebrow: 一句话总结
  highlight: 先把结构搭稳，再让主题接管气质
  body: 这样同一篇内容切到不同主题时，重点和节奏仍然清楚。
  :::
agent_contract:
  body_format: fields
  required:
    - one-line.highlight
    - three.items
    - decision.fit-or-recommendation
    - save.items
  optional:
    - variant
    - eyebrow
    - highlight
    - title
    - body
    - items
    - fit
    - not_fit
    - recommendation
    - note
  enums:
    variant:
      - three
      - decision
      - save
  defaults:
    omitted-variant: one-line
  invalid:
    - one-line.missing-highlight
    - three.missing-items
    - decision.missing-fit-and-recommendation
    - save.missing-items
  ignored:
    - inapplicable-fields
    - unknown-fields
  legacy:
    - points-to-three
    - recommend-to-decision
    - checklist-to-save
    - action-to-save
    - for-to-fit
    - not-to-not_fit
    - avoid-to-not_fit
    - fit_label
    - not_fit_label
    - highlight-title-fallback
    - items-auto-three
    - decision-fields-auto-decision
    - case-folded-variant
  applicability: {}
metadata:
  author: md2wechat
  provenance: builtin
  inspired_by: "advanced-layout-modules-guide.md#summary"
