schema_version: "1"
name: cta
lifecycle: recommended
body_format: fields
version: "1.0.0"
since: "1.5.0"
category: conversion
serves: [conversion]
content_types: [opinion, tutorial, announcement, product-launch]
industry: [general]
tags: [conversion, cta, action, closing, engagement]
position: closing
input_positions: [body-kv]
when_to_use: |
  结尾互动区，提示保存、套用、继续体验。
  适合文章结尾引导读者采取下一步行动。
when_not_to_use: |
  关注引导用 subscribe；
  章节过渡用 bridge。
pairs_well_with: [subscribe, summary, author-card]
avoid_combining_with: [cta]
anti_pattern: |
  缺少 title 导致渲染失败；
  三个固定按钮文字不能通过字段修改；
  note 写成完整段落（应简短）。
fields:
  required:
    - name: title
      description: 行动引导主文案，说明为什么读者应该采取行动
      example: "如果你想把公众号内容做成稳定可复用的结构，可以直接从这套高级模块开始。"
  optional:
    - name: variant
      description: 行动区结构变体
      enum: [save-follow, consult, trial]
      default: save-follow
      example: save-follow
    - name: note
      description: 底部说明（如品牌语或签名）
      example: "BUILD WITH STRUCTURE"
    - name: subtitle
      description: 副标题
      example: "三分钟上手，立刻开始"
    - name: primary
      description: 主要行动文案
      default: 收藏这篇
      example: "保存灵感"
    - name: secondary
      description: 次要行动文案
      default: 关注更新
      example: "直接套用"
    - name: tertiary
      description: 第三行动文案
      default: 转给同事
      example: "继续体验"
    - name: points
      description: 试用分支的要点，用 | 分隔，最多三项
      applies_to: [trial]
      example: "先看工作流 | 试一版高级稿 | 获取 API Key"
  shapes:
    - field: points
      separator: "|"
      max_parts: 3
variants:
  - name: save-follow
    use_when: 结尾引导收藏或关注
    required: [title]
  - name: consult
    use_when: 结尾引导咨询
    defaults:
      primary: 回复「排版」
      secondary: 查看案例
      tertiary: 收藏这篇
    required: [title]
    example: |
      :::cta
      variant: consult
      title: 需要校准现有内容系统，可以发起咨询
      primary: 回复「排版」
      secondary: 查看案例
      tertiary: 收藏这篇
      :::
  - name: trial
    use_when: 结尾引导试用或购买
    defaults:
      primary: 试一版高级稿
      secondary: 查看工作流
      tertiary: 获取 API Key
    required: [title]
    example: |
      :::cta
      variant: trial
      title: 先用一篇真实文章验证效果
      primary: 试一版高级稿
      secondary: 查看工作流
      tertiary: 获取 API Key
      points: 先看工作流 | 试一版高级稿 | 获取 API Key
      :::
example: |
  :::cta
  title: 如果这篇对你有帮助，可以先收藏，再试着改一篇自己的文章。
  primary: 收藏这篇
  secondary: 关注更新
  tertiary: 转给同事
  note: 适合知识型文章
  :::
metadata:
  author: md2wechat
  provenance: builtin
  inspired_by: "advanced-layout-modules-guide.md#cta"
