schema_version: "1"
name: quote
lifecycle: recommended
body_format: fields
version: "1.0.0"
since: "1.5.0"
category: evidence
input_positions: [body-kv]
serves: [attention, memorability]
content_types: [opinion, tutorial, report, announcement]
industry: [general]
tags: [evidence, quote, pullquote, citation]
position: body
when_to_use: |
  金句、引文、观点强调。
  适合访谈摘录、作者核心观点、有说服力的引用。
when_not_to_use: |
  需要大段引用时直接用 blockquote；
  封面金句用 quote-card（sprint4）。
pairs_well_with: [verdict, infographic, bridge]
avoid_combining_with: []
anti_pattern: |
  quote 和 text 都没有导致渲染失败；
  引用内容太长超过 3 句话；
  source 写成空字符串导致显示问题。
fields:
  required:
    - name: quote
      description: 引用正文
      example: "模块不是为了让页面更满，而是为了让读者更快找到判断、证据和下一步。"
  optional:
    - name: variant
      description: 引用结构变体
      enum: [light, brand, proof]
      default: light
      example: light
    - name: eyebrow
      description: 标签词，定位引用的角色
      default: 观点强调
      example: "核心观点"
    - name: source
      description: 来源说明（作者名或文章名）
      example: "内容设计原则"
    - name: brand
      description: 品牌名称
      example: md2wechat
    - name: role
      description: 作者身份
      example: "内容设计师"
    - name: context
      description: 来源上下文
      example: "模块设计复盘"
    - name: source_type
      description: 来源类型
      example: "研究"
    - name: note
      description: 底部说明
      example: "适合金句、访谈摘录、文章结论"
    - name: image
      description: 辅助图片 URL 或 Markdown 图片
      example: "https://example.com/quote.png"
    - name: image_alt
      description: 辅助图片替代文字
      example: "引用场景"
  compatibility:
    - name: text
      description: 引用正文别名
      example: "模块不是为了让页面更满，而是为了让读者更快找到判断、证据和下一步。"
    - name: author
      description: 作者名称
      example: "内容设计团队"
    - name: tone
      description: "旧版样式选择"
      enum: [accent, default]
      example: "accent"
    - name: img
      description: image 的兼容别名
      example: "https://example.com/quote.png"
    - name: cover
      description: image 的兼容别名
      example: "https://example.com/quote.png"
    - name: alt
      description: image_alt 的兼容别名
      example: "引用场景"
  compatibility_required_any:
    - [quote, text]
variants:
  - name: light
    aliases: [default, plain]
    use_when: 需要轻量突出一句引用
    required: [quote]
    compatibility_required_any:
      - [quote, text]
  - name: brand
    aliases: [accent]
    use_when: 需要突出品牌主张
    required: [quote]
    compatibility_required_any:
      - [quote, text]
    example: |
      :::quote
      variant: brand
      quote: 主题负责气质，模块负责说服力。
      brand: md2wechat
      :::
  - name: proof
    aliases: [evidence]
    use_when: 需要展示有来源的证据引用
    required: [source, quote]
    compatibility_required_any:
      - [quote, text]
    example: |
      :::quote
      variant: proof
      quote: 稳定契约比模板数量更重要。
      source: 模块契约研究
      :::
example: |
  :::quote
  eyebrow: 核心观点
  quote: 模块帮助读者更快找到判断、证据和下一步。
  source: 内容设计原则
  note: 适合金句、访谈摘录、文章结论
  :::
agent_contract:
  body_format: fields
  required:
    - quote
  optional:
    - variant
    - image
    - image_alt
    - eyebrow
    - source
    - brand
    - role
    - context
    - source_type
    - note
  enums:
    variant:
      - light
      - brand
      - proof
  defaults:
    variant: light
    eyebrow: 观点强调
    proof-without-source: light
  invalid:
    - blank-quote
  ignored:
    - unsafe-image
    - unknown-fields
  legacy:
    - text-to-quote
    - author-to-source
    - img-to-image
    - cover-to-image
    - alt-to-image_alt
    - default-to-light
    - plain-to-light
    - accent-to-brand
    - evidence-to-proof
    - tone-accent-to-brand
    - case-folded-variant
  applicability: {}
metadata:
  author: md2wechat
  provenance: builtin
  inspired_by: "advanced-layout-modules-guide.md#quote"
