schema_version: "1"
name: gallery-grid
lifecycle: recommended
body_format: markdown_images
version: "1.0.0"
since: "1.5.0"
category: evidence
input_positions: [header-attrs, markdown-body]
serves: [attention, readability]
content_types: [tutorial, report, announcement, product-launch]
industry: [general]
tags: [evidence, image, gallery, grid, portfolio]
position: body
when_to_use: |
  等宽图集，适合多张同级图片、作品集、产品状态展示。
  图片之间没有明显顺序时使用。
when_not_to_use: |
  图片有先后叙事时用 gallery-story；
  单张图片需要正式图注或来源时用 figure-caption。
pairs_well_with: [figure-caption, image-text, part]
avoid_combining_with: []
anti_pattern: |
  没有任何有效 Markdown 图片会导致渲染失败；
  每行使用 Markdown 图片，图后可用竖线接标题。
opener:
  param_style: braces
  params:
    - name: variant
      description: 图集外观
      enum: [clean, card]
      default: clean
    - name: density
      enum: [compact, normal, airy]
      default: normal
    - name: columns
      description: 图集列数
      default: "3"
    - name: image_shape
      enum: [square, rounded, phone, poster, original]
      default: square
    - name: caption_style
      enum: [none, minimal, numbered, label]
      default: minimal
    - name: accent
      enum: [brand, muted, contrast]
      default: brand
    - name: wechat_safe_level
      enum: [strict, normal]
      default: normal
    - name: title
      description: 图集标题
    - name: description
      description: 图集说明
body:
  min_images: 1
example: |
  :::gallery-grid{columns=3 variant=card}
  ![A](https://example.com/1.jpg) | 首页状态
  ![B](https://example.com/2.jpg) | 详情状态
  ![C](https://example.com/3.jpg) | 结果状态
  :::
agent_contract:
  body_format: markdown_images
  required:
    - image
  optional:
    - variant
    - density
    - columns
    - image_shape
    - caption_style
    - accent
    - wechat_safe_level
    - title
    - description
  enums:
    variant:
      - clean
      - card
    density:
      - compact
      - normal
      - airy
    image_shape:
      - square
      - rounded
      - phone
      - poster
      - original
    caption_style:
      - none
      - minimal
      - numbered
      - label
    accent:
      - brand
      - muted
      - contrast
    wechat_safe_level:
      - strict
      - normal
  defaults:
    variant: clean
    density: normal
    columns: "3"
    columns-out-of-range: clamped-1-4
    image_shape: square
    caption_style: minimal
    accent: brand
    wechat_safe_level: normal
    unknown-enum: field-default
  invalid:
    - malformed-image
  ignored:
    - unsupported-attrs
  legacy:
    - case-folded-header-keys
    - magazine-to-clean
    - tech-to-clean
    - elegant-to-clean
    - bold-to-clean
    - experimental-to-normal
  applicability: {}
metadata:
  author: md2wechat
  provenance: builtin
  inspired_by: "advanced-layout-modules-guide.md#gallery-grid"
