schema_version: "1"
name: gallery-story
lifecycle: recommended
body_format: markdown_images
version: "1.0.0"
since: "1.5.0"
category: evidence
input_positions: [header-attrs, markdown-body]
serves: [attention, readability]
content_types: [tutorial, report, announcement]
industry: [general]
tags: [evidence, image, gallery, story, journey]
position: body
when_to_use: |
  故事流图集，适合旅程、过程、案例叙事。
  图片有明确先后顺序时使用。
when_not_to_use: |
  多张同级图片用 gallery-grid；
  带操作步骤的教学内容用 image-steps。
pairs_well_with: [image-steps, figure-caption, part]
avoid_combining_with: []
anti_pattern: |
  没有任何有效 Markdown 图片会导致渲染失败；
  每行使用图片、标题、说明的顺序。
opener:
  param_style: braces
  params:
    - name: variant
      description: 故事流外观
      enum: [clean, card]
      default: card
    - name: density
      enum: [compact, normal, airy]
      default: normal
    - name: caption_style
      enum: [none, minimal, numbered, label]
      default: minimal
    - name: accent
      enum: [brand, muted, contrast]
      default: brand
    - name: wechat_safe_level
      enum: [strict, normal]
      default: normal
body:
  min_images: 1
example: |
  :::gallery-story{variant=card}
  ![第一站](https://example.com/story-1.jpg) | 第一站 | 用一张图建立现场感。
  ![第二站](https://example.com/story-2.jpg) | 第二站 | 用段落解释关键细节。
  :::
agent_contract:
  body_format: markdown_images
  required:
    - image
    - title
    - body
  optional:
    - variant
    - density
    - caption_style
    - accent
    - wechat_safe_level
  enums:
    variant:
      - clean
      - card
    density:
      - compact
      - normal
      - airy
    caption_style:
      - none
      - minimal
      - numbered
      - label
    accent:
      - brand
      - muted
      - contrast
    wechat_safe_level:
      - strict
      - normal
  defaults:
    variant: card
    density: normal
    caption_style: minimal
    accent: brand
    wechat_safe_level: normal
    unknown-enum: field-default
  invalid:
    - malformed-image
    - malformed-row
  ignored:
    - unsupported-attrs
  legacy:
    - case-folded-header-keys
    - magazine-to-clean
    - tech-to-clean
    - elegant-to-clean
    - bold-to-clean
    - experimental-to-normal
  applicability: {}
metadata:
  author: md2wechat
  provenance: builtin
  inspired_by: "advanced-layout-modules-guide.md#gallery-story"
