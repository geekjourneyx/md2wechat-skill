schema_version: "1"
name: image-steps
lifecycle: recommended
body_format: markdown_fields
version: "1.0.0"
since: "1.5.0"
category: evidence
input_positions: [header-attrs, prefix-dsl, markdown-body]
serves: [readability]
content_types: [tutorial]
industry: [general]
tags: [evidence, image, steps, tutorial, how-to]
position: body
when_to_use: |
  带图片的教学步骤。
  适合操作教程、软件使用说明、有截图的流程演示。
when_not_to_use: |
  无图片步骤用 steps；
  图片标注用 image-annotate；
  单张图片说明用 image-text。
pairs_well_with: [steps, image-text, part]
avoid_combining_with: []
anti_pattern: |
  没有任何完整 step + desc 组导致渲染失败；
  图片必须使用 Markdown 图片语法并放在对应 step 后。
opener:
  param_style: braces
  params:
    - name: columns
      description: 步骤列数
      enum: ["1", "2", "3", "4"]
      default: "1"
    - name: caption_style
      description: 序号样式
      enum: [none, minimal, numbered, label]
      default: numbered
    - name: accent
      description: 强调色模式
      enum: [brand, muted, contrast]
      default: brand
    - name: density
      description: 内容密度
      enum: [compact, normal, airy]
      default: normal
    - name: wechat_safe_level
      enum: [strict, normal]
      default: normal
fields:
  optional:
    - name: step
      description: 步骤标题，可重复
      example: 打开编辑器
    - name: desc
      description: 步骤说明
      example: 选择主题和文章结构。
    - name: note
      description: 步骤备注
      example: 先确认文章目标
body:
  group:
    start: step
    required: [step, desc]
    min: 1
example: |
  :::image-steps{columns=2 caption_style=numbered}
  step: 打开编辑器
  ![打开](https://example.com/open.jpg)
  desc: 选择主题和文章结构。
  note: 先确认文章目标
  step: 复制到微信
  ![复制](https://example.com/copy.jpg)
  desc: 检查预览后复制。
  :::
agent_contract:
  body_format: markdown_fields
  required:
    - step
    - image
    - desc
  optional:
    - note
    - columns
    - caption_style
    - accent
    - density
    - wechat_safe_level
  enums:
    caption_style:
      - none
      - minimal
      - numbered
      - label
    accent:
      - brand
      - muted
      - contrast
    density:
      - compact
      - normal
      - airy
    wechat_safe_level:
      - strict
      - normal
  defaults:
    columns: "1"
    columns-out-of-range: clamped-1-4
    caption_style: numbered
    accent: brand
    density: normal
    wechat_safe_level: normal
    unknown-enum: field-default
  invalid:
    - malformed-group
  ignored:
    - unsupported-attrs
  legacy:
    - case-folded-header-keys
    - Step-label
    - Desc-label
    - Note-label
    - experimental-to-normal
  applicability: {}
metadata:
  author: md2wechat
  provenance: builtin
  inspired_by: "advanced-layout-modules-guide.md#image-steps"
