schema_version: "1"
name: gallery
lifecycle: compatibility
body_format: markdown_images
version: "1.0.0"
since: "1.5.0"
category: compatibility
serves: [readability]
content_types: [tutorial, report, announcement]
industry: [general]
tags: [compatibility, legacy, image, gallery]
position: body
when_to_use: |
  迁移仍使用 :::gallery[...] 的旧稿时使用，保持原有多图语法可发现、可校验。
when_not_to_use: |
  新内容不要使用；同级多图优先使用 gallery-grid，有叙事顺序时使用 gallery-story，
  操作演示使用 image-steps，对照内容使用 image-compare。
anti_pattern: |
  没有有效 Markdown 图片会导致校验失败；不要把兼容语法当作新内容的默认选择。
opener:
  caption: true
body:
  min_images: 1
example: |
  :::gallery[主题画廊]
  ![图一](https://example.com/1.png)
  ![图二](https://example.com/2.png)
  :::
example_assert_contains: "![图一](https://example.com/1.png)"
metadata:
  author: md2wechat
  provenance: builtin
  inspired_by: "advanced-layout-modules-guide.md#gallery"
