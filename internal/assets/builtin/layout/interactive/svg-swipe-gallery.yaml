schema_version: "1"
name: svg-swipe-gallery
lifecycle: recommended
body_format: markdown_images
version: "1.0.0"
since: "1.5.0"
category: interactive
input_positions: [header-attrs, markdown-body]
serves: [attention, memorability]
content_types: [tutorial, report, announcement, product-launch]
industry: [general]
tags: [interactive, svg, image, gallery, swipe]
position: body
when_to_use: |
  点击切换两张图片，适合产品图、前后视觉叙事、活动图。
  这是点击切换，不是手指拖拽轮播。
when_not_to_use: |
  多于两张图片的普通图集用 gallery-grid；
  不需要互动时使用静态图片模块。
pairs_well_with: [gallery-grid, image-compare, figure-caption]
avoid_combining_with: []
anti_pattern: |
  少于两张有效 Markdown 图片会导致渲染失败；
  只有 HTTPS mmbiz.qpic.cn 图片 URL 可进入 SVG image，其他 URL 或 svg_fallback=static 会降级为静态 HTML 图片卡；
  默认只取前两张图片做点击切换。
opener:
  param_style: braces
  params:
    - name: variant
      enum: [clean, card]
      default: card
    - name: accent
      enum: [brand, muted, contrast]
      default: brand
    - name: density
      enum: [compact, normal, airy]
      default: normal
    - name: wechat_safe_level
      enum: [strict, normal]
      default: normal
    - name: svg_fallback
      description: SVG 不可用时的回退策略
      enum: [static, first-layer]
      default: first-layer
    - name: title
      description: 图集标题
body:
  min_images: 2
example: |
  :::svg-swipe-gallery
  ![A](https://mmbiz.qpic.cn/...) | 第一张
  ![B](https://mmbiz.qpic.cn/...) | 第二张
  :::
example_assert_contains: "第一张"
agent_contract:
  body_format: markdown_images
  required:
    - image
  optional:
    - variant
    - accent
    - density
    - wechat_safe_level
    - svg_fallback
    - title
  enums:
    variant:
      - clean
      - card
    accent:
      - brand
      - muted
      - contrast
    density:
      - compact
      - normal
      - airy
    wechat_safe_level:
      - strict
      - normal
    svg_fallback:
      - static
      - first-layer
  defaults:
    variant: card
    accent: brand
    density: normal
    wechat_safe_level: normal
    svg_fallback: first-layer
    unknown-enum: field-default
  invalid:
    - zero-valid-images
    - malformed-image
  ignored:
    - interactive-images-after-2
    - unsupported-attrs
  legacy:
    - one-image-static-card
    - case-folded-header-keys
    - magazine-to-clean
    - tech-to-clean
    - elegant-to-clean
    - bold-to-clean
    - experimental-to-normal
  applicability: {}
metadata:
  author: md2wechat
  provenance: builtin
  inspired_by: "advanced-layout-modules-guide.md#svg-swipe-gallery"
