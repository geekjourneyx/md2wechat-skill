name: cover-semantic-concept
kind: image
description: 将核心词语、角色关系与视觉隐喻咬合成一体的概念海报封面
version: "1.0"
archetype: cover
primary_use_case: cover
recommended_aspect_ratios:
  - 21:9
  - 16:9
default_aspect_ratio: 21:9
metadata:
  author: geekjourneyx
  provenance: adapted
  inspired_by: plan-visual-assets
tags:
  - cover
  - semantic
  - concept-poster
  - typography
  - metaphor
examples:
  - 观点强、具有概念张力的文章封面
  - 需要把一个关键词视觉化的公众号封面
variables:
  - ARTICLE_TITLE
  - ARTICLE_SUMMARY
  - KEYWORDS
  - VISUAL_STYLE
  - ASPECT_RATIO
template: |
  为下面的公众号文章生成一张高级语义概念海报封面。画幅为 {{ASPECT_RATIO}}。

  内容输入：
  - 文章标题：{{ARTICLE_TITLE}}
  - 文章摘要：{{ARTICLE_SUMMARY}}
  - 关键词：{{KEYWORDS}}
  - 风格补充：{{VISUAL_STYLE}}

  先在内部理解文章，再从标题、摘要与关键词中提炼 2 至 6 个中文字符或 1 至 3 个英文单词作为唯一核心文字。核心文字必须表达文章的深层判断，不能机械照抄长标题。不要输出分析过程。

  核心目标：
  1. 不是普通插画，也不是“文字贴在背景上”的字效海报，而是基于词义进行视觉转译。
  2. 文字、图像、构图、色彩、空间、承载面、角色动作与视觉隐喻必须共同组成一个完整视觉句子。
  3. 画面要一眼有冲击、二眼能读懂、三眼能发现文字与图像之间的巧妙关系。

  构图机制：
  1. 设置一个清晰横向承载面，例如舞台、土地、台基、坡面、切面、地平线或平台，让主体真正“站住”。
  2. 只使用 1 至 3 个关键人物、角色或物体，通过朝向、距离、动作、对峙、给予、等待、穿越、遮挡或失衡关系演绎词义。
  3. 核心文字必须巨大、清晰、强识别，成为背景墙、空间屏障、建筑块、舞台后景或叙事容器。
  4. 必须实现文字嵌入构图：主体可以站在字前、进入字内、穿越字形，或让字被遮挡、切割、借位，但核心文字仍要可读。

  色彩与材质：
  1. 只使用 2 至 4 种主色关系，颜色服务词义和情绪。
  2. 优先采用纸张印刷、艺术出版、石版印刷、丝网印刷或版画质感。
  3. 保持强平面设计感、明确视觉中心和充足留白，不堆元素。

  文字规则：
  1. 核心文字必须准确，不得出现错字或变形到不可识别。
  2. 除核心文字外，默认不生成辅助文字；不得生成随机编号、日期、署名、坐标、出版信息或装饰性小字。

  负向约束：
  不要普通插画封面、电商海报、廉价模板、文字漂浮、无关装饰、拥挤拼贴、彩虹色、廉价霓虹、复杂 UI、二维码、logo 或低分辨率。
