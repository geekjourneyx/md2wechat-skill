name: cover-editorial-collage
kind: image
description: 手撕拼贴、杂志排版与复古印刷质感结合的编辑封面
version: "1.0"
archetype: cover
primary_use_case: cover
recommended_aspect_ratios:
  - 21:9
  - 5:2
  - 3:2
default_aspect_ratio: 21:9
metadata:
  author: geekjourneyx
  provenance: adapted
  inspired_by: plan-visual-assets
tags:
  - cover
  - editorial
  - collage
  - torn-paper
  - magazine
examples:
  - AI 写作、方法论和教程文章封面
  - 社会观察、城市文化和社群主题封面
variables:
  - ARTICLE_TITLE
  - ARTICLE_SUMMARY
  - KEYWORDS
  - VISUAL_STYLE
  - ASPECT_RATIO
template: |
  为下面的公众号文章生成一张高级编辑剪贴画封面，画幅为 {{ASPECT_RATIO}}。

  内容输入：
  - 文章标题：{{ARTICLE_TITLE}}
  - 文章摘要：{{ARTICLE_SUMMARY}}
  - 关键词：{{KEYWORDS}}
  - 风格补充：{{VISUAL_STYLE}}

  在内部完成主题理解和标题提炼，不要输出分析过程。把长标题分成三层：
  1. 从文章中提炼 2 至 6 个中文字符或 1 至 3 个英文单词作为巨型主视觉文字。
  2. 将完整标题作为中号编辑信息保留，但不得抢夺主视觉。
  3. 只允许极少量与主题直接相关的栏目标签或关键词；不得使用随机编号、随机日期或无意义英文填空。

  风格基因：
  1. 手撕拼贴、视觉杂志、复古印刷颗粒、多材质叠加、强标题排版和图像隐喻。
  2. 使用真实不规则撕纸边缘、旧报纸、杂志裁片、便签、票据、胶带、贴纸、复印纸、半调网点、扫描纹理或轻微套印错位。
  3. 画面看似随手拼贴，但必须拥有明确视觉中心、精确层级和整体设计平衡。
  4. 像独立杂志封面、青年文化刊物、艺术展览海报或高级视觉档案，不像素材堆叠。

  构图系统：
  1. 第一层是巨型主标题，可以被纸片局部切割、被主体穿插或压在图像后方，但必须可读。
  2. 第二层只选择 1 至 3 个服务主题的视觉锚点，例如眼睛、手、稿纸、人物、城市、植物、地图、屏幕或放大镜。
  3. 第三层使用少量纸条、胶带、批注、箭头、标签和印刷符号建立叙事关系。
  4. 背景使用旧纸、复印纸、低饱和照片层或彩色纸底，不能是毫无质感的纯空白。
  5. 图与字必须发生遮挡、穿插、压印、撕裂或借位关系，不能各自独立。

  色彩策略：
  根据主题选择一套受控配色，例如红黑白、橙黄蓝、粉黄蓝、黑白灰加单一强调色，或复古米纸加撞色贴纸。至少有一个记忆色，但整体不能脏乱或像电商促销图。

  负向约束：
  不要拼贴素材乱堆、无视觉中心、假撕纸边缘、PPT 模板、电商海报、标题不可读、文字错别字、低级朋克脏乱、AI 机器人脸、廉价赛博霓虹、无关开门场景、大段说明文字、二维码、logo 或低分辨率。
